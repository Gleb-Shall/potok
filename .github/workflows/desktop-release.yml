name: Desktop installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
concurrency:
  group: desktop-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release versions and portable configuration
        run: GITHUB_REF_NAME="$RELEASE_TAG" node scripts/check-desktop-release.mjs
      - run: npm ci
      - run: npm test && npm run test:ui
      - name: Prepare draft prerelease
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Potok $RELEASE_TAG — Desktop" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          [[ "$release_id" =~ ^[0-9]+$ ]] || { echo 'Missing release ID'; exit 1; }
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.platform }}
    env:
      VITE_FIREBASE_CONFIG: ''
      VITE_EVENT_PUSH_ENABLED: 'false'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: Build and upload installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Verify all installers and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > assets.txt
          grep -q 'aarch64.*\.dmg$' assets.txt
          grep -q 'x64.*\.dmg$' assets.txt
          grep -q '\.exe$' assets.txt
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
  notify_cloud_desktop:
    name: Request matching private installers
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Dispatch exact released core to private build
        env:
          DISPATCH_TOKEN: ${{ secrets.POTOK_CLOUD_DISPATCH_TOKEN }}
        run: |
          export CORE_SHA="$(git rev-parse HEAD)"
          node --input-type=module <<'JS'
          if(!/^[a-f0-9]{40}$/.test(process.env.CORE_SHA || '')) throw new Error('Missing release SHA');
          if(!process.env.DISPATCH_TOKEN) throw new Error('Missing private dispatch token');
          const response=await fetch('https://api.github.com/repos/Gleb-Shall/potok-cloud/actions/workflows/desktop-release.yml/dispatches',{
            method:'POST',
            headers:{Authorization:`Bearer ${process.env.DISPATCH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10','Content-Type':'application/json'},
            body:JSON.stringify({ref:'main',inputs:{release_tag:process.env.RELEASE_TAG,core_ref:process.env.CORE_SHA}})
          });
          if(!response.ok) throw new Error(`Private release request failed: HTTP ${response.status}`);
          console.log('Private installers requested for the released core.');
          JS
