<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f4f2">
    <style>:root{color-scheme:light;background:#f2f4f2}:root.dark{color-scheme:dark;background:#171c19}</style>
    <script>
      (() => {
        let theme = 'system';
        try { theme = localStorage.getItem('potok:theme') || 'system'; } catch {}
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <meta name="description" content="Поток — события, записи и твой ритм. Планируй занятия и встречи, храни нужные сведения рядом и удобно переноси события.">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <title>Поток — события, записи и твой ритм</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
    <noscript>Для работы расписания включи JavaScript.</noscript>
  </body>
</html>
